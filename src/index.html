<!doctype html>
<html lang="en" class="light-theme">
<head>
  <meta charset="utf-8">
  <title>Invigil · Examination Control System</title>
  <meta name="description" content="Invigil allots exam halls, benches and seats, publishes the register, and lets any student find their seat with a hall ticket number — no login.">
  <meta name="theme-color" content="#8fc8fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a1428" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="Invigil · Examination Control System">
  <meta property="og:description" content="Hall allotment, invigilator duty rosters and public seat lookup for examinations.">
  <meta property="og:type" content="website">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <!-- Typography is Helvetica/Arial + the platform monospace: no webfont request,
       no third-party connection, and no flash of unstyled text. -->
  <script>
    // Paint the saved theme before first render so the page never flashes.
    (function () {
      try {
        var dark = localStorage.getItem('theme') === 'dark';
        document.documentElement.classList.toggle('light-theme', !dark);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
